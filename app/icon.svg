<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cataloo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b74ff"/>
      <stop offset="1" stop-color="#1e50c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Shopping bag + catalog, scaled up to fill the tile (kept inside the maskable safe zone) -->
  <g transform="translate(256,256) scale(2.0) translate(-256,-296)">
    <!-- Bag handles (two loops) -->
    <path d="M216 250 C216 214 246 214 246 250" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <path d="M266 250 C266 214 296 214 296 250" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <!-- Bag body (trapezoid) -->
    <path d="M202 250 L310 250 L331 356 Q331 378 309 378 L203 378 Q181 378 181 356 Z" fill="#ffffff"/>
    <!-- Catalog / product list -->
    <rect x="214" y="290" width="84" height="14" rx="7" fill="#1e50c8"/>
    <rect x="214" y="318" width="84" height="14" rx="7" fill="#1e50c8"/>
    <rect x="214" y="346" width="52" height="14" rx="7" fill="#3b74ff"/>
  </g>
</svg>
